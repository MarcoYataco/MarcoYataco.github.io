# .github/workflows/ci-cd.yml
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint de index.html (HTMLHint)
        run: npx --yes htmlhint@1.1.4 index.html

      - name: Lint de api/Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
          config: .hadolint.yaml

      - name: Lint de web/Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          config: .hadolint.yaml

      - name: Lint de db/Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: db/Dockerfile
          config: .hadolint.yaml

      - name: Lint de la API (ESLint)
        run: npx --yes eslint@9 api/app.js

      - name: Armar el sitio (_site/)
        run: bash scripts/armar-sitio.sh

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Descargar el sitio armado por build
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Descomprimir el sitio en _site/
        run: |
          mkdir _site
          tar -xf artifact.tar -C _site
          ls -la _site

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (Vitest)
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta-web.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y etiquetas de perfil-web