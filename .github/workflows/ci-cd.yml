# .github/workflows/ci-cd.yml
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint de index.html (HTMLHint)
        run: npx --yes htmlhint@1.1.4 index.html

      - name: Lint de api/Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
          config: .hadolint.yaml

      - name: Lint de web/Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          config: .hadolint.yaml

      - name: Lint de db/Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: db/Dockerfile
          config: .hadolint.yaml

      - name: Lint de la API (ESLint)
        run: npx --yes eslint@9 api/app.js

      - name: Armar el sitio (_site/)
        run: bash scripts/armar-sitio.sh

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Descargar el sitio armado por build
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Descomprimir el sitio en _site/
        run: |
          mkdir _site
          tar -xf artifact.tar -C _site
          ls -la _site

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (Vitest)
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y etiquetas de perfil-web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marcoyataco/perfil-web
          flavor: latest=false
          tags: type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Construir y publicar perfil-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Tags y etiquetas de perfil-api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marcoyataco/perfil-api
          flavor: latest=false
          tags: type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Construir y publicar perfil-api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  security:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Calcular el tag del commit
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Trivy sobre perfil-web
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/marcoyataco/perfil-web:${{ env.TAG }}
          scan-type: image
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy sobre perfil-api
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/marcoyataco/perfil-api:${{ env.TAG }}
          scan-type: image
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: security
    runs-on: ubuntu-24.04
    steps:
      - run: echo "smoke pendiente"

  deploy-prod:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        run: echo "deploy pendiente"