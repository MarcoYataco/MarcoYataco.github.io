# .github/workflows/ci-cd.yml
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "build pendiente"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "test pendiente"

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "package pendiente"

  security:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: echo "security pendiente"

  smoke:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke pendiente"

  deploy-prod:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        run: echo "deploy pendiente"