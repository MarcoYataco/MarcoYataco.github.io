server {
    listen 80;

    # Sirve tu index.html, estilos.css y libro-de-visitas.js
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Todo lo que llegue a /api/ se reenvía al contenedor de la API,
    # usando el nombre del servicio "api" tal como se llama en compose.yaml.
    # Docker resuelve ese nombre dentro de la red interna.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}